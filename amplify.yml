version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
    backend:
      phases:
        build:
          commands:
            - npx amplify generate --branch $AWS_BRANCH --app-id $AWS_APP_ID
      cache:
        paths:
          - .npm/**/*